<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业微信问答</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    #chat { border: 1px solid #ddd; padding: 12px; height: 60vh; overflow: auto; border-radius: 8px; }
    .msg { margin: 8px 0; line-height: 1.5; }
    .me { color: #111; }
    .bot { color: #0b57d0; }
    #row { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #0b57d0; color: #fff; }
    button:disabled { background: #999; }
  </style>
</head>
<body>
  <div id="chat"></div>

  <div id="row">
    <input id="q" placeholder="请输入问题…" />
    <button id="send">发送</button>
  </div>

  <script>
   const N8N_WEBHOOK_URL = "https://maxsu.app.n8n.cloud/webhook-test/424617f9-d09a-4852-aeb9-103ded52387e";

    const chat = document.getElementById('chat');
    const input = document.getElementById('q');
    const sendBtn = document.getElementById('send');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function ask() {
      const question = input.value.trim();
      if (!question) return;

      addMsg("我： " + question, "me");
      input.value = "";
      sendBtn.disabled = true;

      try {
        const resp = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        // n8n 建议返回 JSON：{ answer: "..." }  [web:52]
        const data = await resp.json();
        addMsg("助手： " + (data.answer || JSON.stringify(data)), "bot");
      } catch (e) {
        addMsg("助手：请求失败，请稍后再试（或检查 Webhook 地址/跨域/网络）", "bot");
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = ask;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') ask();
    });
  </script>
</body>
</html>
